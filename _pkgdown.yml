url: https://drruili.github.io/MSdev/

template:
  bootstrap: 5

home:
  title: MSdev
  description: >
    LC-MS processing shell for project orchestration, xcms feature
    processing, spectra, annotation, and downstream analysis.
  links:
  - text: Personal page
    href: https://drruili.github.io/
  - text: GitHub
    href: https://github.com/DrRuiLi/MSdev
  - text: Email
    href: mailto:rli@sinh.ac.cn

navbar:
  structure:
    left:  [intro, reference, articles]
    right: [search, github, lightswitch]

articles:
- title: Get started
  navbar: ~
  contents:
  - starts_with("MSdev")
- title: Technical notes
  contents:
  - starts_with("articles/")
- title: Developer notes
  contents:
  - matches("^dev_")

footer:
  structure:
    left: developed_by
    right: built_with
