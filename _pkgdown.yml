url: https://drruili.github.io/MSdev/

template:
  bootstrap: 5
  light-switch: true
  theme: atom-one-light
  theme-dark: atom-one-dark
  bslib:
    primary: "#0F766E"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "IBM Plex Sans"}
    code_font: {google: "IBM Plex Mono"}

home:
  title: MSdev
  description: >
    LC-MS processing shell for project orchestration, xcms feature
    processing, spectra, annotation, and downstream analysis.
  links:
  - text: Personal page
    href: https://drruili.github.io/
  - text: GitHub
    href: https://github.com/DrRuiLi/MSdev
  - text: Email
    href: mailto:lirui3@shanghaitech.edu.cn

navbar:
  structure:
    left:  [intro, reference, articles]
    right: [search, github, lightswitch]

articles:
- title: Get started
  navbar: ~
  contents:
  - starts_with("MSdev")
- title: Technical notes
  contents:
  - starts_with("articles/")
- title: Developer notes
  contents:
  - matches("^dev_")

footer:
  structure:
    left: developed_by
    right: built_with
